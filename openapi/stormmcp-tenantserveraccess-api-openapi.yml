      summary: Revokes the app of one tenant-server access assignment everywhere (MCPG-2330)…
      description: 'The token is the digest `POST revoke-impact` returned for this row''s library. A missing or

        stale token answers 409 `Gateway.RevokeNotAcknowledged` with the current impact in the

        `impact` extension and changes nothing. An in-use app is no longer refused: the revoke

        removes it from every gateway, session and agent deployment, and leaves its credentials stored.'

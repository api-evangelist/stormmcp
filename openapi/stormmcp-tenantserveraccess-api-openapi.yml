components:
  schemas:
    AppRevokeImpactTenantConfiguration:
      type: object
      properties:
        libraryId:
          type: string
          description: Gets the library id.
          format: uuid
        authType:
          oneOf:
          - type: 'null'
          - description: Gets the configuration's auth type, or null when unknown.
            $ref: '#/components/schemas/McpServerAuthType'
      description: The Tenant configuration of a revoked app (MCPG-2384).
    AppRevokeImpactDeployment:
      type: object
      properties:
        id:
          type: string
          description: Gets the Platform deployment id.
          format: uuid
        name:
          type: string
          description: Gets the deployment name.
        libraryId:
          type: string
          description: Gets the library id the deployment binds.
          format: uuid
        projectId:
          type:
          - 'null'
          - string
          description: Gets the deployment's project id, or null when it has none.
          format: uuid
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AppRevokeImpactAgent'
          description: Gets the agents that reference the deployment.
      description: An agent deployment that binds a revoked app, read from Platform (MCPG-2384).
    AppRevokeResponse:
      type: object
      properties:
        revocationId:
          type: string
          description: Gets the revocation id, the idempotency key every downstream consumer keys on.
          format: uuid
        libraryIds:
          type: array
          items:
            type: string
            format: uuid
          description: Gets the revoked library ids.
        switchedToCustomMode:
          type: boolean
          description: Gets a value indicating whether the revoke switched the tenant from Default to Custom mode.
        strippedGatewayCount:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets the number of gateways the revoked apps were removed from.
          format: int32
        deletedApprovalGrantCount:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets the number of approval grant rows the revoke deleted.
          format: int32
      description: The outcome of an acknowledged admin app revoke (MCPG-2384).
    AppRevokeImpactApprovalGrant:
      type: object
      properties:
        libraryId:
          type: string
          description: Gets the library id.
          format: uuid
        principalType:
          description: Gets the principal type.
          $ref: '#/components/schemas/ApprovalPrincipalType'
        principalId:
          type: string
          description: Gets the principal id. Guid Guid.Empty for ApprovalPrincipalType.AllUsers.
          format: uuid
        grantsAppAccess:
          type: boolean
          description: Gets a value indicating whether the grant confers app access.
        toolMode:
          description: Gets the tool scope mode.
          $ref: '#/components/schemas/ApprovalToolMode'
        selectedToolNames:
          type: array
          items:
            type: string
          description: Gets the selected tool names, sorted ordinally. Empty under ApprovalToolMode.All.
      description: 'An approval grant a revoke resets (MCPG-2384). A revoke returns the app to never approved, so

        every grant and tool scope it lists is discarded and part of what the admin acknowledges.'
    ApprovalPrincipalType:
      type: integer
      description: 'The principal an approval grant row is scoped to (MCPG-1547). Feature-prefixed —

        deliberately not shared with GatewayAccessPrincipalType or

        AdminToolkitPrincipalType so the member sets can evolve independently.

        Stored as a string through the strict `ApprovalPrincipalTypeConverter` (unknown

        store values throw; never bare `HasConversion&lt;string&gt;()`).'
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - 'null'
          - string
        title:
          type:
          - 'null'
          - string
        status:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          format: int32
        detail:
          type:
          - 'null'
          - string
        instance:
          type:
          - 'null'
          - string
    McpServerAuthType:
      type: integer
      description: An enumeration representing the authentication types for MCP servers.
    AppRevokeRequest:
      type: object
      properties:
        libraryIds:
          type: array
          items:
            type: string
            format: uuid
          description: Gets or sets the library ids to revoke.
        acknowledgmentToken:
          type:
          - 'null'
          - string
          description: Gets or sets the digest returned by preflight for the same selection.
      description: Request body for the acknowledged admin app revoke (MCPG-2384).
    Level:
      enum:
      - Personal
      - Tenant
    AppRevokeImpactAgent:
      type: object
      properties:
        id:
          type: string
          description: Gets the Platform pipeline id.
          format: uuid
        name:
          type: string
          description: Gets the agent name.
      description: An agent that references a deployment of a revoked app (MCPG-2384).
    AppRevokeImpactGateway:
      type: object
      properties:
        id:
          type: string
          description: Gets the gateway id.
          format: uuid
        name:
          type:
          - 'null'
          - string
          description: Gets the gateway name, or null when bool AppRevokeImpactGateway.NameWithheld is true.
        nameWithheld:
          type: boolean
          description: 'Gets a value indicating whether the name is withheld. True for a Personal gateway the caller

            does not own.'
        level:
          description: Gets the gateway level.
          $ref: '#/components/schemas/Level'
        ownerUserId:
          type:
          - 'null'
          - string
          description: Gets the owning user id. Set for every Personal gateway, null for a Tenant gateway.
          format: uuid
        libraryIds:
          type: array
          items:
            type: string
            format: uuid
          description: Gets the revoked library ids this gateway lists, sorted.
      description: A gateway that lists a revoked app (MCPG-2384).
    TenantServerAccessResponse:
      type: object
      properties:
        id:
          type: string
          description: Gets or sets the unique identifier for this access assignment.
          format: uuid
        tenantId:
          type: string
          description: Gets or sets the tenant ID that has access.
          format: uuid
        libraryId:
          type: string
          description: Gets or sets the library ID from the known-mcp-servers.json file.
          format: uuid
        createdAt:
          type: string
          description: Gets or sets when this access was created.
          format: date-time
        updatedAt:
          type: string
          description: Gets or sets when this access was last updated.
          format: date-time
      description: Response model for tenant-server access assignments.
    AppRevokeImpactResponse:
      type: object
      properties:
        libraryIds:
          type: array
          items:
            type: string
            format: uuid
          description: Gets the library ids the impact covers, sorted ascending.
        switchesToCustomMode:
          type: boolean
          description: 'Gets a value indicating whether the revoke switches the tenant from Default to Custom mode.

            True when the tenant is in Default mode now.'
        gateways:
          type: array
          items:
            $ref: '#/components/schemas/AppRevokeImpactGateway'
          description: Gets every gateway in the tenant that lists a revoked app, whoever owns it.
        personalConnections:
          type: array
          items:
            $ref: '#/components/schemas/AppRevokeImpactPersonalConnection'
          description: Gets every personal connection to a revoked app, by owning user id. The caller is included.
        tenantConfigurations:
          type: array
          items:
            $ref: '#/components/schemas/AppRevokeImpactTenantConfiguration'
          description: Gets the Tenant configurations of the revoked apps.
        deployments:
          type: array
          items:
            $ref: '#/components/schemas/AppRevokeImpactDeployment'
          description: Gets the agent deployments that bind a revoked app, read from Platform.
        approvalGrants:
          type: array
          items:
            $ref: '#/components/schemas/AppRevokeImpactApprovalGrant'
          description: 'Gets the approval grants and tool scopes of the revoked apps, which the revoke resets to

            never approved.'
        connectionsRetained:
          type: boolean
          description: 'Gets a value indicating whether stored connections are kept by the revoke. Always true: a

            revoke never clears a credential.'
        digest:
          type: string
          description: Gets the acknowledgment digest of this impact set.
      description: 'The impact set of revoking a selection of apps, and the digest an acknowledged revoke must carry

        (MCPG-2384).'
    PagedResultOfTenantServerAccessResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TenantServerAccessResponse'
          description: Gets or sets the items in the current page.
        totalCount:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets or sets the total count of items across all pages.
          format: int32
        pageNumber:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets or sets the current page number (1-based).
          format: int32
        pageSize:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets or sets the number of items per page.
          format: int32
        hasMore:
          type: boolean
          description: Gets a value indicating whether there are more pages available.
        totalPages:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets the total number of pages.
          format: int32
      description: Generic paged result wrapper for API responses.
    CreateTenantServerAccessRequest:
      required:
      - libraryId
      type: object
      properties:
        libraryId:
          type: string
          description: Gets or sets the library ID from the known-mcp-servers.json file.
          format: uuid
      description: Request model for granting tenant access to a restricted server.
    AppRevokeImpactPersonalConnection:
      type: object
      properties:
        libraryId:
          type: string
          description: Gets the library id.
          format: uuid
        userId:
          type: string
          description: Gets the owning user id.
          format: uuid
        source:
          type: string
          description: Gets where the connection is stored. One of AppRevokeConnectionSources.
        authType:
          oneOf:
          - type: 'null'
          - description: Gets the connection's auth type, or null when unknown.
            $ref: '#/components/schemas/McpServerAuthType'
      description: A personal connection to a revoked app, named by owning user id (MCPG-2384).
    AppRevokeImpactRequest:
      type: object
      properties:
        libraryIds:
          type: array
          items:
            type: string
            format: uuid
          description: Gets or sets the library ids to revoke. One to one hundred, distinct after normalisation.
      description: 'Request body for the admin app-revoke preflight (MCPG-2384). One preflight covers the whole

        selection.'
    ApprovalToolMode:
      type: integer

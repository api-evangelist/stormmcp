openapi: 3.2.0
info:
  title: MCP Gateway Tenant Server Access API
  description: API for MCP Gateway operations
  version: v1
servers:
- url: https://dev.stormmcp.ai/
tags:
- name: TenantServerAccess
paths:
  /api/v1/admin/TenantServerAccess:
    get:
      tags:
      - TenantServerAccess
      summary: Gets tenant-server access assignments for the current tenant with pagination
      parameters:
      - name: pageNumber
        in: query
        description: 'The page number (1-based, default: 1).'
        schema:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: 'The number of items per page (default: 20, max: 1000).'
        schema:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PagedResultOfTenantServerAccessResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResultOfTenantServerAccessResponse'

      x-operation-id-source: derived
  /api/v1/Library/status:
    get:
      tags:
      - Library
      summary: Gets the list of known MCP providers with status, scoped to the tenant's…
      parameters:
      - name: status
        in: query
        schema:
          type: string
      - name: includeNotConfigured
        in: query
        description: 'When `true`, returns the full catalog including servers

          whose per-tenant integration status is `NotConfigured`. Default

          `false` preserves the historical "hide unconnected

          servers" behavior expected by existing admin / gateway-card consumers.

          The Platform self-service portal opts in to this flag so users can see

          catalog servers they haven''t connected yet (the recovery deep-link flow

          lands on that surface specifically to drive a connect action on

          `NotConfigured` libraries).'
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnownMcpServerWithStatus'
            application/json:

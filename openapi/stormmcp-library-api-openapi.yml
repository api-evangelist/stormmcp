  /api/v1/Library/admin/custom-servers/{serverId}/assignment:
    put:
      tags:
      - Library
      summary: Toggles the assignment status of a custom server for the tenant's custom list.
      description: 'Turning an approved server off is an admin revoke (MCPG-2330) and goes through the same

        acknowledged entrance as `POST api/v1/admin/TenantServerAccess/revoke`:

        `acknowledgmentToken` is the digest the preflight returned for this server, and a missing or

        stale token answers 409 `Gateway.RevokeNotAcknowledged` with the current impact and changes

        nothing. Turning off a server that is not approved has nothing to revoke and needs no token.

        Turning a server on needs no token.'
      parameters:
      - name: serverId
        in: path
        description: The custom server ID.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: The cancellation token.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCustomServerAssignmentRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/SetCustomServerAssignmentRequest'

  /api/v1/Library/admin/servers-with-assignment-status:
    get:
      tags:
      - Library
      summary: Gets all servers (library + custom) with their assignment status for the…
      parameters:
      - name: search
        in: query
        description: Optional search term to filter servers by name or description.
        schema:
          type: string
      - name: category
        in: query
        description: Optional category to filter servers (e.g., "Productivity", "Development").
        schema:
          type: string
      - name: availability
        in: query
        description: Optional availability filter (General, Restricted).
        schema:
          type: string
      - name: type
        in: query
        description: Optional server type filter (Hosted, Sandbox, Remote, McpLink).
        schema:
          type: string
      - name: featured
        in: query
        description: Optional filter to return only featured servers when true.
        schema:
          type: boolean
      - name: pageNumber
        in: query
        description: 'The page number (1-based, default: 1).'
        schema:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: 'The number of items per page (default: 20, max: 100).'
        schema:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
          default: 20
      - name: sortBy
        in: query
        description: 'Optional sort field (name, category, status, gatewayCount). Default: name.'
        schema:
          type: string
      - name: sortDirection
        in: query
        description: 'Optional sort direction (ASC, DESC). Default: ASC.'
        schema:
          type: string
      responses:

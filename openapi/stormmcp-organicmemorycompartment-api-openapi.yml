components:
  schemas:
    JsonElement: {}
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - 'null'
          - string
        title:
          type:
          - 'null'
          - string
        status:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          format: int32
        detail:
          type:
          - 'null'
          - string
        instance:
          type:
          - 'null'
          - string
    OrganicMemoryItemDeleteRequest:
      type: object
      properties:
        ids:
          type:
          - 'null'
          - array
          items:
            type: string
            format: uuid
          description: Gets the item ids. Between one and 200.
      description: The items to delete from one compartment the caller owns.
    OrganicMemoryCompartmentResponse:
      type: object
      properties:
        id:
          type: string
          description: Gets the compartment id.
          format: uuid
        displayName:
          type: string
          description: Gets the display name.
        description:
          type:
          - 'null'
          - string
          description: Gets the description.
        owned:
          type: boolean
          description: Gets a value indicating whether the caller owns this compartment.
        serveToGateway:
          type: boolean
          description: Gets a value indicating whether this compartment is served to the gateway.
        default:
          type: boolean
          description: 'Gets a value indicating whether this is the caller''s default compartment.

            Exactly one owned compartment is marked, and a shared compartment never is.'
      description: 'One compartment the caller can see. Shared compartments are included.

        The response carries no owner address.'
    OrganicMemoryCompartmentShareRequest:
      type: object
      properties:
        email:
          type:
          - 'null'
          - string
          description: Gets the email address. This is not a directory search.
        permission:
          type:
          - 'null'
          - string
          description: 'Gets the access to grant. Optional: omitted means read. Only

            string OrganicMemorySharePermissions.Read is accepted today (MCPG-2905); any other

            value is refused with `OrganicMemory.SharePermissionInvalid`, so write access can be

            allowed later without changing the contract (MCPG-2906).'
      description: Shares a compartment the caller owns with one exact email.
    OrganicMemoryCompartmentUnshareRequest:
      type: object
      properties:
        email:
          type:
          - 'null'
          - string
          description: Gets the email address the compartment is shared with.
      description: Stops sharing a compartment the caller owns with one exact email.
    OrganicMemoryCompartmentCreateRequest:
      type: object
      properties:
        displayName:
          type:
          - 'null'
          - string
          description: Gets the display name. The memory service slug is derived from it.
        serveToGateway:
          type:
          - 'null'
          - boolean
          description: 'Gets whether this compartment is served while the per-user switch is on.

            Omit it and the compartment is served.'
      description: Creates a compartment the caller owns.
    OrganicMemoryCompartmentRenameRequest:
      type: object
      properties:
        displayName:
          type:
          - 'null'
          - string
          description: Gets the new display name. Omit it to leave the name unchanged.
        serveToGateway:
          type:
          - 'null'
          - boolean
          description: 'Gets whether this compartment is served while the per-user switch is on.

            Omit it to leave the flag unchanged.'
      description: A rename or serve-flag update of a compartment the caller owns.
    OrganicMemoryCompartmentRenameResponse:
      type: object
      properties:
        id:
          type: string
          description: Gets the compartment id.
          format: uuid
        displayName:
          type: string
          description: Gets the display name.
        description:
          type:
          - 'null'
          - string
          description: Gets the description.
        owned:
          type: boolean
          description: Gets a value indicating whether the caller owns this compartment.
        serveToGateway:
          type: boolean
          description: Gets a value indicating whether this compartment is served to the gateway.
        default:
          type:
          - 'null'
          - boolean
          description: 'Gets a value indicating whether this is the caller''s default compartment.

            Null when the follow-up list fails or does not contain the row.

            The property is written when it is null, because the API omits null properties otherwise.'
      description: 'The compartment a rename returned. bool? OrganicMemoryCompartmentRenameResponse.Default is null when the

        follow-up list fails or does not contain the row.'

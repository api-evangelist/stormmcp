components:
  schemas:
    AdminToolkitEntryRequest:
      type: object
      properties:
        libraryId:
          type: string
          description: Gets or sets the library identifier.
          format: uuid
        selectedToolNames:
          type:
          - 'null'
          - array
          items:
            type: string
          description: Gets or sets the selected original upstream tool names. Null means all tools.
      description: One library's membership in an admin toolkit.
    ReplaceAdminToolkitAssignmentsRequest:
      type: object
      properties:
        userIds:
          type: array
          items:
            type: string
            format: uuid
          description: Gets or sets the user identifiers. An empty list is allowed.
        groupIds:
          type: array
          items:
            type: string
            format: uuid
          description: Gets or sets the group identifiers. An empty list is allowed.
      description: Request to replace an admin toolkit's assignments (MCPG-1671).
    AdminToolkitEntryResponse:
      type: object
      properties:
        libraryId:
          type: string
          description: Gets or sets the library identifier.
          format: uuid
        selectedToolNames:
          type:
          - 'null'
          - array
          items:
            type: string
          description: Gets or sets the selected original upstream tool names. Null means all tools.
      description: One library's membership in an admin toolkit.
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - 'null'
          - string
        title:
          type:
          - 'null'
          - string
        status:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          format: int32
        detail:
          type:
          - 'null'
          - string
        instance:
          type:
          - 'null'
          - string
    PagedResultOfAdminToolkitResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminToolkitResponse'
          description: Gets or sets the items in the current page.
        totalCount:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets or sets the total count of items across all pages.
          format: int32
        pageNumber:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets or sets the current page number (1-based).
          format: int32
        pageSize:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets or sets the number of items per page.
          format: int32
        hasMore:
          type: boolean
          description: Gets a value indicating whether there are more pages available.
        totalPages:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets the total number of pages.
          format: int32
      description: Generic paged result wrapper for API responses.
    CreateAdminToolkitRequest:
      type: object
      properties:
        name:
          type: string
          description: 'Gets or sets the toolkit name. Create allocates `{Name} ({n})`

            when this value is already used in the tenant so a stale-list

            default-name POST still succeeds (MCPG-1734).'
        description:
          type:
          - 'null'
          - string
          description: Gets or sets the optional description.
        assignmentMode:
          oneOf:
          - type: 'null'
          - description: 'Gets or sets the assignment mode. Omitted is

              AdminToolkitAssignmentMode.Editable. Numeric tokens and

              unknown names are 400 (MCPG-1699).'
            $ref: '#/components/schemas/AdminToolkitAssignmentMode'
      description: Request to create an admin toolkit (MCPG-1671).
    AdminToolkitAssignmentMode:
      description: 'How assignees may change an admin-assigned toolkit (MCPG-1699).

        Existing rows default to AdminToolkitAssignmentMode.Editable.'
    AdminToolkitResponse:
      type: object
      properties:
        id:
          type: string
          description: Gets or sets the toolkit identifier.
          format: uuid
        name:
          type: string
          description: Gets or sets the toolkit name.
        description:
          type:
          - 'null'
          - string
          description: Gets or sets the optional description.
        isDraft:
          type: boolean
          description: Gets or sets a value indicating whether this toolkit has zero assignments (draft).
        assignmentMode:
          description: Gets or sets the assignment mode (MCPG-1699).
          $ref: '#/components/schemas/AdminToolkitAssignmentMode'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AdminToolkitEntryResponse'
          description: Gets or sets the included servers.
        userIds:
          type: array
          items:
            type: string
            format: uuid
          description: Gets or sets the assigned user identifiers.
        groupIds:
          type: array
          items:
            type: string
            format: uuid
          description: Gets or sets the assigned group identifiers.
        createdBy:
          type: string
          description: Gets or sets the user who created this toolkit.
          format: uuid
        createdAt:
          type: string
          description: Gets or sets the creation timestamp.
          format: date-time
        updatedAt:
          type: string
          description: Gets or sets the update timestamp.
          format: date-time
      description: An admin toolkit with entries and assignments (MCPG-1671).
    UpdateAdminToolkitRequest:
      type: object
      properties:
        name:
          type: string
          description: Gets or sets the toolkit name.
        description:
          type:
          - 'null'
          - string
          description: Gets or sets the optional description.
        assignmentMode:
          oneOf:
          - type: 'null'
          - description: 'Gets or sets the assignment mode. Null keeps the persisted value (stacked

              clients that have not yet sent the field). A provided value replaces it.

              Numeric tokens and unknown names are 400 (MCPG-1699).'
            $ref: '#/components/schemas/AdminToolkitAssignmentMode'
        entries:
          type:
          - 'null'
          - array
          items:
            $ref: '#/components/schemas/AdminToolkitEntryRequest'
          description: 'Gets or sets the replacement entry set. An empty list is allowed. Explicit JSON

            `null` is treated as empty (STJ invokes the setter with `null`).'
      description: Request to replace an admin toolkit's name, description, and entries (MCPG-1671).

  /api/v1/admin/approvals/libraries/{libraryId}/grants/{principalType}/{principalId}/tools:
    put:
      tags:
      - Approvals
      summary: Sets one principal's tool scope on a library (MCPG-1649, PRD AS5).
      parameters:
      - name: libraryId
        in: path
        description: The library identifier (catalog or custom).
        required: true
        schema:
          type: string
          format: uuid
      - name: principalType
        in: path
        description: The target principal kind.
        required: true
        schema:
          $ref: '#/components/schemas/ApprovalPrincipalType'
      - name: principalId
        in: path
        description: "The target principal id (the empty GUID iff\n    principalType is AllUsers)."
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: The cancellation token.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalToolScopeRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ApprovalToolScopeRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ApprovalToolScopeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:

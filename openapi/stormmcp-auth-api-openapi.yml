openapi: 3.2.0
info:
  title: MCP Gateway Auth API
  description: API for MCP Gateway operations
  version: v1
servers:
- url: https://dev.stormmcp.ai/
tags:
- name: Auth
paths:
  /api/v1/Auth/me:
    get:
      tags:
      - Auth
      summary: Gets the current authenticated user's information
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
            text/csv:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
            application/csv:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/csv:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/csv:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      operationId: getApiV1AuthMe
      x-operation-id-source: derived
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - 'null'
          - string
        title:
          type:
          - 'null'
          - string
        status:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          format: int32
        detail:
          type:
          - 'null'
          - string
        instance:
          type:
          - 'null'
          - string
    UserInfoResponse:
      type: object
      properties:
        userId:
          type:
          - 'null'
          - string
          description: Gets or sets the user ID.
        email:
          type:
          - 'null'
          - string
          description: Gets or sets the user's email address.
        name:
          type:
          - 'null'
          - string
          description: Gets or sets the user's display name.
        isAuthenticated:
          type: boolean
          description: Gets or sets a value indicating whether the user is authenticated.
      description: Represents user information for authenticated users.

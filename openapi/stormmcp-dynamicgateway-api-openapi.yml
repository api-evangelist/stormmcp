    McpConnectionState:
      type: object
      properties:
        outcome:
          description: Gets the coarse outcome — the ubiquitous language shared across BE and FE.
          $ref: '#/components/schemas/McpConnectionOutcome'
        disabled:
          type: boolean
          description: 'Gets a value indicating whether an admin has disabled this integration at

            the tenant level. Orthogonal to McpConnectionOutcome McpConnectionState.Outcome: the outcome still

            reflects the underlying connection readiness, so re-enabling needs no

            re-derivation. Only a configured row can be disabled.'
        reason:
          type:
          - 'null'
          - string
          description: 'Gets the machine-readable reason from McpConnectionReasons,

            or null when none applies. Set for McpConnectionOutcome.Error,

            for Connected plus string McpConnectionReasons.RefreshPending, and

            for NeedsSetup plus

            string McpConnectionReasons.SchemaCredentialNotConfigured.'
        reasonDetails:
          type:
          - 'null'
          - string
          description: 'Gets optional developer-facing detail refining the reason (e.g. UCS error

            code, exception message). May be surfaced in logs and ProblemDetails but

            must not be used for end-user UI strings.'
        interactiveAvailable:
          type:
          - 'null'
          - boolean
          description: 'Gets a value indicating whether an interactive personal-OAuth connect,

            setup, or reconnect can clear this classification. Present as

            `true` only for `not_configured`,

            `awaiting_credentials`, `credential_invalid`, and

            `misconfigured` when the primary credential of an interactive

            personal-OAuth source is the cause. Absent (`null`) for

            non-interactive sources, Connected results, and reasons a primary

            connect cannot clear. Never `false`.'
        recoveryCommand:
          oneOf:
          - type: 'null'
          - description: 'Gets the recovery action for this classification. Null on an unstamped

              singleton (omitted from JSON and gRPC). A stamped wire state always

              carries a value other than RecoveryCommand.Unspecified.

              Absent means the client keeps today''s derivation. Present is authoritative

              and replaces reading string? McpConnectionState.Reason to choose Connect, Reconnect,

              Configure, or Save credential.'
            $ref: '#/components/schemas/RecoveryCommand'
      description: "            State-only view of an MCP server connection — the wire-shape primitive that\n            every transport (REST, gRPC, SignalR push, future Orleans grain messages)\n            can carry without dragging the entire `McpServerConfiguration`\n            along. The build-outcome wrapper `McpConnectionResult` composes a\n            state with the optional built configuration.\n            Shape contract:* McpConnectionOutcome McpConnectionState.Outcome is always set.\n* string? McpConnectionState.Reason is set when\n                McpConnectionOutcome McpConnectionState.Outcome is McpConnectionOutcome.Error (from\n                McpConnectionReasons), when McpConnectionOutcome McpConnectionState.Outcome is\n                McpConnectionOutcome.Connected and the value is\n                string McpConnectionReasons.RefreshPending, or when\n                McpConnectionOutcome McpConnectionState.Outcome is McpConnectionOutcome.NeedsSetup\n                and the value is\n                string McpConnectionReasons.SchemaCredentialNotConfigured. Other\n                Connected and NeedsSetup results keep string? McpConnectionState.Reason null.\n                Unknown non-error reasons are informational and never a gate.\n* string? McpConnectionState.ReasonDetails is an optional human-readable refinement\n                (UCS error code, exception message) intended for logs and developer-facing\n                diagnostics — not for end-user UI strings.\n* Exception? McpConnectionState.Error is the original exception when the outcome was\n                caused by one. Internal use only — never serialized.\n* bool McpConnectionState.Disabled is an orthogonal admin-disable flag — it can\n                be true alongside any McpConnectionOutcome McpConnectionState.Outcome (a Connected or NeedsAuth\n                server can still be admin-disabled), so it does not collapse into the\n                readiness outcome.\n* bool? McpConnectionState.InteractiveAvailable is present (`true`)\n                only for a user-recoverable classification of an interactive personal-OAuth\n                source. It is omitted (`null`) otherwise and is never\n                `false`.\n* RecoveryCommand? McpConnectionState.RecoveryCommand is the recovery action. It is omitted\n                (`null`) on an unstamped singleton so an old payload stays\n                absent. A present value is authoritative. RecoveryCommand.Unspecified\n                is never stored."

components:
  schemas:
    SetDynamicGatewayLibraryPreferenceRequest:
      type: object
      properties:
        enabledOverride:
          type:
          - 'null'
          - boolean
          description: 'Gets or sets the nullable app-level override.

            Null means reset to follow admin default.'
      description: Request to set a dynamic gateway app-level preference.
    ActivityResponse:
      type: object
      properties:
        aggregates:
          description: 'Gets or sets the windowed aggregates.

            Deprecated. Existing readers still receive this field. Removal is MCPG-2186.'
          $ref: '#/components/schemas/ActivityAggregatesResponse'
        series7d:
          type: array
          items:
            $ref: '#/components/schemas/ActivitySeriesPointResponse'
          description: 'Gets or sets the fixed 7-day daily series.

            Deprecated. Existing readers still receive this field. Removal is MCPG-2186.

            Day keys are UTC. A client that needs local days sums IReadOnlyList&lt;ActivityBucket20mResponse&gt; ActivityResponse.Buckets20m.'
        series24h:
          type: array
          items:
            $ref: '#/components/schemas/ActivitySeries24hBucketResponse'
          description: Gets or sets the fixed 24-hour outcome-split series (72 × 20-min buckets, AI-51). Window-independent.
        buckets20m:
          type: array
          items:
            $ref: '#/components/schemas/ActivityBucket20mResponse'
          description: 'Gets or sets 768 UTC-aligned 15-minute buckets covering 8 x 24h (MCPG-2192).

            The JSON name `buckets20m` is historical. The last bucket contains now.

            DateTimeOffset ActivityResponse.WindowStart is the first bucket start

            and DateTimeOffset ActivityResponse.WindowEnd is the exclusive end of the last bucket.'
        windowStart:
          type: string
          description: Gets or sets the UTC start of the first IReadOnlyList&lt;ActivityBucket20mResponse&gt; ActivityResponse.Buckets20m bucket.
          format: date-time
        windowEnd:
          type: string
          description: Gets or sets the exclusive UTC end of the last IReadOnlyList&lt;ActivityBucket20mResponse&gt; ActivityResponse.Buckets20m bucket.
          format: date-time
        recent:
          type: array
          items:
            $ref: '#/components/schemas/ActivityRecentRowResponse'
          description: 'Gets or sets the latest matching tool-call rows. An outcome, client, or tool-name

            query is applied before the cap of 50. This list is not a total. Older calls stay

            in MCP Monitoring.'
      description: Current-user dynamic gateway activity projection (MCPG-1156).
    ActivityOutcome:
      type: integer
      description: Outcome of a recorded tool call (MCPG-1156), mapped from the request-log status.
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - 'null'
          - string
        title:
          type:
          - 'null'
          - string
        status:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          format: int32
        detail:
          type:
          - 'null'
          - string
        instance:
          type:
          - 'null'
          - string
    SkillsPreferenceResponse:
      type: object
      properties:
        masterEnabled:
          type: boolean
          description: Gets or sets a value indicating whether the master switch is on.
        deselections:
          type: array
          items:
            $ref: '#/components/schemas/SkillDeselectionResponse'
          description: Gets or sets the deselected skills.
        enabledLibraryIds:
          type: array
          items:
            type: string
            format: uuid
          description: 'Gets or sets the SkillLink library ids the caller has opted into. Empty

            means no repository is served even when bool SkillsPreferenceResponse.MasterEnabled is true.'
      description: Response for the stored skills preference.
    DynamicGatewayUserPreferencesResponse:
      type: object
      properties:
        tenantId:
          type: string
          description: Gets or sets the tenant identifier.
          format: uuid
        userId:
          type: string
          description: Gets or sets the user identifier.
          format: uuid
        preferences:
          type: array
          items:
            $ref: '#/components/schemas/DynamicGatewayLibraryPreferenceResponse'
          description: Gets or sets the stored library preferences.
      description: Dynamic gateway preference response for the authenticated tenant/user.
    RadarCacheResponse:
      type: object
      properties:
        size:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets or sets the effective per-user cache slot budget.
          format: int32
        used:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets or sets the number of cached tools.
          format: int32
        entries:
          type: array
          items:
            $ref: '#/components/schemas/RadarCacheEntryResponse'
          description: Gets or sets the cached tool entries, sorted by 7-day hits descending.
        minSize:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets or sets the inclusive minimum allowed int RadarCacheResponse.Size (`MaxPinnedTools + 1`).
          format: int32
        maxSize:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets or sets the inclusive maximum allowed int RadarCacheResponse.Size.
          format: int32
        step:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets or sets the size adjustment step (always 1 for integer slots).
          format: int32
        maxPinned:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets or sets the maximum number of pinned tools.
          format: int32
      description: Current-user Radar cache view (MCPG-1156).
    ApprovalClassificationResponse:
      type: object
      properties:
        approved:
          type: boolean
          description: Gets or sets a value indicating whether the calling user holds app approval for this library.
        toolMode:
          oneOf:
          - type: 'null'
          - description: 'Gets or sets the approved tool scope when bool ApprovalClassificationResponse.Approved is true; null otherwise.

              ApprovalToolMode.All is symbolic — the consuming surface expands it against the

              library''s live tool inventory.'
            $ref: '#/components/schemas/ApprovalToolMode'
        selectedToolNames:
          type:
          - 'null'
          - array
          items:
            type: string
          description: 'Gets or sets the approved tool names when ApprovalToolMode? ApprovalClassificationResponse.ToolMode is

            ApprovalToolMode.Selected; empty for ApprovalToolMode.All, null when

            unapproved.'
      description: 'The calling user''s approval classification for one summary row (MCPG-1550). Informational: the

        server never narrows a listing or refuses an operation on it — the personal gateway and personal

        toolkit pickers render from it, and refusal at use is MCPG-1652''s. ApprovalToolMode

        reaches the TypeScript client by DTO reference (MCPG-1547); do not register it in

        `StandaloneEnumSchemaProcessor`.'
    SkillsInventorySkillResponse:
      type: object
      properties:
        url:
          type: string
          description: Gets or sets the source-published skill URL, verbatim.
        digest:
          type:
          - 'null'
          - string
          description: Gets or sets the upstream digest, verbatim when present.
        frontmatter:
          oneOf:
          - type: 'null'
          - description: 'Gets or sets the upstream frontmatter, cloned from the index entry when present.

              SEP-2640 publishes this as a JSON object; a string node is preserved as a string.'
            $ref: '#/components/schemas/JsonNode'
        selected:
          type: boolean
          description: Gets or sets a value indicating whether the skill is selected (not deselected).
        scanStatus:
          type:
          - 'null'
          - string
          description: Gets or sets the governance scan status, or null when no scan ran.
      description: One skill in the editor inventory.
    CreateToolkitRequest:
      type: object
      properties:
        name:
          type: string
          description: Gets or sets the toolkit name.
        description:
          type:
          - 'null'
          - string
          description: Gets or sets the optional description.
      description: Request to create a toolkit (MCPG-1130).
    SetSkillSourceRequest:
      required:
      - libraryId
      - enabled
      type: object
      properties:
        libraryId:
          type: string
          description: Gets or sets the SkillLink library identifier.
          format: uuid
        enabled:
          type: boolean
          description: Gets or sets a value indicating whether the source is enabled.
      description: 'Request to enable or disable one SkillLink source (MCPG-1766). Enabling lights

        up every skill in that repository except existing deselections.'
    ActivitySeriesPointResponse:
      type: object
      properties:
        day:
          type: string
          description: Gets or sets the day.
          format: date
        calls:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets or sets the tool-call count on that day.
          format: int32
      description: One day of the 7-day series.
    McpServerStatus:
      enum:
      - Available
      - ComingSoon
      - Beta
      - Deprecated
      - Custom
      description: Availability status for MCP servers.
    ActivitySeries24hBucketResponse:
      type: object
      properties:
        bucketStart:
          type: string
          description: Gets or sets the UTC start of the 20-minute bucket (aligned to a 20-min boundary).
          format: date-time
        succeeded:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets or sets the successful tool calls in the bucket.
          format: int32
        failed:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets or sets the failed tool calls in the bucket.
          format: int32
        denied:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets or sets the policy-denied tool calls in the bucket.
          format: int32
        unknown:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets or sets the tool calls whose status did not map to Succeeded/Failed/Denied (AI-58).
          format: int32
      description: One 20-minute bucket of the 24-hour outcome-split series (AI-51).
    SetRadarCacheSizeRequest:
      required:
      - size
      type: object
      properties:
        size:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets or sets the new cache slot budget.
          format: int32
      description: Request to set the current user's Radar cache size (MCPG-1156).
    DynamicGatewayToolCountsResponse:
      type: object
      properties:
        available:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets or sets the number of available tools.
          format: int32
        selected:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Gets or sets the number of selected tools.
          format: int32
      description: Dynamic gateway tool-count DTO.
    SkillDeselectionResponse:
      type: object
      properties:
        libraryId:
          type: string
          description: Gets or sets the library identifier.
          format: uuid
        skillUrl:
          type: string
          description: Gets or sets the source-published skill URL.
      description: One deselected skill on the preference response.
    GatewayMetadataResponse:
      type: object
      properties:
        name:
          type: string
          description: Gets or sets the display name (derived; not stored while row-less).
        kind:
          description: Gets or sets the gateway kind.
          $ref: '#/components/schemas/GatewayKind'
        endpoint:
          type: string
          description: Gets or sets the public dynamic MCP endpoint URL.
        tenantId:
          type: string
          description: Gets or sets the tenant identifier.
          format: uuid
      description: 'Current-user dynamic gateway metadata (MCPG-1156). Uses only real or deterministically-derived values;

        `createdAt` is intentionally absent in v1 because the dynamic gateway is row-less and has no

        creation timestamp. `health` is intentionally omitted (AI-56 / Antonio review): synthesizing

        gateway health from per-library `McpConnectionState` conflates infrastructure health with

        integration connection state; the FE derives a connections note from `/me/summary` instead.'
    DynamicGatewayToolPreferenceResponse:
      type: object
      properties:
        mode:
          description: Gets or sets the tool preference mode.
          $ref: '#/components/schemas/DynamicToolPreferenceMode'
        selectedToolNames:
          type: array
          items:
            type: string
          description: Gets or sets selected original upstream tool names.
      description: Dynamic gateway tool preference DTO.
    SkillsInventoryResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/SkillsInventoryGroupResponse'
          description: Gets or sets the per-server groups.
      description: 'On-demand full per-server skill inventory for the Skills toolkit editor (MCPG-1511).

        Includes deselected skills. Distinct from the MCP `skill://index.json` read.

        Available with the master switch off.'
    SetToolkitMemberRequest:
      type: object
      properties:
        toolMode:
          description: Gets or sets the tool preference mode.
          $ref: '#/components/schemas/DynamicToolPreferenceMode'
        selectedToolNames:
          type: array
          items:
            type: string
          description: Gets or sets the original upstream tool names selected by the user.
      description: Request to add or update a toolkit member (MCPG-1130).
    JsonNode: {}
    GatewayKind:
      type: integer
      description: 'The kind of dynamic gateway (MCPG-1156). v1 exposes only GatewayKind.Primary; GatewayKind.Auxiliary

        is reserved for the parked auxiliary-gateway feature (MCPG-1164).'
    McpServerType:
      type: integer
      description: An mcp server type enumeration.
    ClientKind:
      type: integer
      description: 'The kind of MCP client that connected to a dynamic gateway (MCPG-1156), derived best-effort from the

        authenticating bearer scheme at handshake time. Display-only; never an authorization input.'
    ToolkitResponse:
      type: object
      properties:
        id:
          type: string
          description: Gets or sets the toolkit identifier.
          format: uuid
        name:
          type: string
          description: Gets or sets the toolkit name.
        description:
          type:
          - 'null'
          - string
          description: Gets or sets the optional description.
        enabled:
          type: boolean
          description: Gets or sets a value indicating whether the toolkit master switch is on.
        members:
          type: array
          items:
            $ref: '#/components/schemas/ToolkitMemberResponse'
          description: Gets or sets the toolkit members.
        createdAt:
          type: string
          description: Gets or sets the creation timestamp.
          format: date-time
        updatedAt:
          type: string
          description: Gets or sets the update timestamp.
          format: date-time
      description: A user's toolkit with its members (MCPG-1130).
    DynamicGatewayLibraryPreferenceResponse:
      type: object
      properties:
        libraryId:
          type: string
          description: Gets or sets the library identifier.
          format: uuid
        enabledOverride:
          type:
          - 'null'
          - boolean
          description: Gets or sets the nullable app-level preference.
        toolMode:
          description: Gets or sets the tool preference mode.
          $ref: '#/components/schemas/DynamicToolPreferenceMode'
        selectedToolNames:
          type: array
          items:
            type: string
          description: Gets or sets canonical selected upstream tool names.
        createdAt:
          type: string
          description: Gets or sets the creation timestamp.
          format: date-time
        updatedAt:
          type: string
          description: Gets or sets the update timestamp.
          format: date-time
      description: Dynamic gateway preference response for one library.
    ResolvedMcpServerResponse:
      type: object
      properties:
        libraryId:
          type: string
          description: Gets or sets the library identifier.
          format: uuid
        type:
          oneOf:
          - type: 'null'
          - description: 'Gets or sets the server type (MCPG-1511). SkillLink rows are

              stripped from IReadOnlyList&lt;ResolvedMcpServerResponse&gt; EffectiveToolSurfaceResponse.McpServers

              when the tenant has at least one SkillLink server.'
            $ref: '#/components/schemas/McpServerType'
        name:
          type: string
          description: Gets or sets the display name.
        provider:
          description: Gets or sets the provider name.
          $ref: '#/components/schemas/KnownMcpProvider'
        category:
          type:
          - 'null'
          - string
          description: Gets or sets the category.
        iconUrl:
          type:
          - 'null'
          - string
          description: Gets or sets the icon URL.
        description:
          type:
          - 'null'
          - string
          description: Gets or sets the description.
        status:
          description: Gets or sets the catalog status (e.g. `Custom` for a tenant-owned server).
          $ref: '#/components/schemas/McpServerStatus'
        scopes:
          type: array
          items:
            type: string
          description: Gets or sets the OAuth scopes the server declares (catalog metadata for the connect flow).
        authType:
          type: array
          items:
            $ref: '#/components/schemas/McpServerAuthType'
          description: Gets or sets the auth types the server supports (catalog metadata for the connect flow).
        currentAuthType:
          oneOf:
          - type: 'null'

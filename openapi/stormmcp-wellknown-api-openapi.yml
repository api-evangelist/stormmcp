openapi: 3.2.0
info:
  title: MCP Gateway Well Known API
  description: API for MCP Gateway operations
  version: v1
servers:
- url: https://dev.stormmcp.ai/
tags:
- name: WellKnown
paths:
  /.well-known/oauth-protected-resource:
    get:
      tags:
      - WellKnown
      summary: Returns metadata for an OAuth2 protected resource as defined in the Model…
      responses:
        '200':
          description: Metadata for the OAuth2 protected resource.
      operationId: getWellKnownOauthProtectedResource
      x-operation-id-source: derived
  /.well-known/oauth-protected-resource/{path}:
    get:
      tags:
      - WellKnown
      summary: Returns metadata for an OAuth2 protected resource as defined in the Model…
      parameters:
      - name: path
        in: path
        description: Optional path parameter for resource-specific metadata requests.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Metadata for the OAuth2 protected resource.
      operationId: getWellKnownOauthProtectedResourceByPath
      x-operation-id-source: derived
  /.well-known/oauth-authorization-server:
    get:
      tags:
      - WellKnown
      summary: Returns the facade OAuth2 Authorization Server metadata (RFC 8414), in both AS…
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/csv:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/csv:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      operationId: getWellKnownOauthAuthorizationServer
      x-operation-id-source: derived
  /.well-known/oauth-authorization-server/{path}:
    get:
      tags:
      - WellKnown
      summary: Returns the facade OAuth2 Authorization Server metadata (RFC 8414), in both AS…
      parameters:
      - name: path
        in: path
        description: Optional path parameter for resource-specific metadata requests.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/csv:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/csv:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      operationId: getWellKnownOauthAuthorizationServerByPath
      x-operation-id-source: derived
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - 'null'
          - string
        title:
          type:
          - 'null'
          - string
        status:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          format: int32
        detail:
          type:
          - 'null'
          - string
        instance:
          type:
          - 'null'
          - string

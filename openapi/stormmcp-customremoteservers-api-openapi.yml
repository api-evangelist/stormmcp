    post:
      tags:
      - CustomRemoteServers
      summary: 'Tests a SpecLink (private-spec) YAML: fetches it, parses it via an ephemeral…'
      description: 'Deliberately does not require the custom-server write gate (MCPG-1793): the probe

        fetches and parses a caller-supplied YAML through an ephemeral session and persists nothing,

